# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Next.js 15 (TypeScript), TailwindCSS v4, Radix UI, pnpm workspace
  Architecture: Next.js App Router + Clean Architecture (domain/application/infrastructure/presentation)
  Testing: Vitest (20 tests)
  Style: TailwindCSS utility-first CSS with Radix UI primitives and Radix Icons

testing:
  strict_tdd: false
  test_runner: vitest
  test_layers:
    unit: true
    integration: true
    e2e: false
  coverage: false
  quality_tools:
    linter: true
    type_checker: true
    formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false           # Set to true to enable RED-GREEN-REFACTOR
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas